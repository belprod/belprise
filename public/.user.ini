; Belprise — PHP limits for PHP-FPM / CGI hosts (mod_php reads public/.htaccess).
; Master chunks are 32 MB (sent with PUT); poster + thumbnail sheet uploads
; can reach ~25 MB.
memory_limit = 256M
post_max_size = 48M
upload_max_filesize = 48M
max_execution_time = 300
max_input_time = 300
display_errors = Off
