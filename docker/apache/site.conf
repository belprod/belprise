# Development only: the site vitrine (site/dist, built by `npm run build`) on port 8090.
Listen 8090
<VirtualHost *:8090>
    DocumentRoot /var/www/belprise/site/dist
    <Directory /var/www/belprise/site/dist>
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    LogFormat "%t \"%m\" %>s %B %D" belprise_site
    CustomLog ${APACHE_LOG_DIR}/access.log belprise_site
</VirtualHost>
