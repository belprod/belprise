# Loaded after Debian's security.conf (alphabetical order), so these win.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# No client IP in the error log (privacy: IPs are never logged in clear).
ErrorLogFormat "[%{u}t] [%-m:%l] [pid %P] %F: %E: %M"

# "client denied" (bots refused by public/.htaccess) would log the URL, and
# URLs carry link keys: these messages are not logged.
LogLevel warn authz_core:crit
