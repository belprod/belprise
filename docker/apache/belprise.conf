<VirtualHost *:80>
    DocumentRoot /var/www/belprise/public

    <Directory /var/www/belprise/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Media are only ever sent by PHP; X-Sendfile may read from data/ only.
    <IfModule mod_xsendfile.c>
        XSendFile On
        XSendFilePath /var/www/belprise/data
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Access log without client IP nor URL: paths carry link keys, which are
    # never logged in clear.
    LogFormat "%t \"%m\" %>s %B %D" belprise
    CustomLog ${APACHE_LOG_DIR}/access.log belprise
</VirtualHost>
